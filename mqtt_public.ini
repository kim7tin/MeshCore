; Build settings of the web-flasher firmware (branch web-flasher only, never part of a pull request).
; Only NON-secret defaults are baked into the published image: broker host, port and topic prefix.
; The MQTT user name and password are typed into the page (or sent with `set mqtt.user` / `set mqtt.pass`)
; and are never stored in this repository.
[platformio]
extra_configs = platformio.ini

[env:Heltec_v3_mqtt_public]
extends = env:Heltec_v3_repeater_bridge_mqtt
build_flags =
  ${env:Heltec_v3_repeater_bridge_mqtt.build_flags}
  -D MQTT_BROKER1_HOST='"103.82.195.161"'
  -D MQTT_BROKER1_PORT=1883
  -D MQTT_TOPIC_PREFIX='"ktm"'
